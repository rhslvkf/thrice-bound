name: Deploy to GitHub Pages

# Build and test on every branch; publish only from the default branch.
# The deploy job's `if` reads the default branch from the repository rather
# than hardcoding a name, so renaming the branch does not silently stop
# deployments.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it: a half-finished
# deployment would leave the live site on a stale build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # `npm run build` proves the bundle was produced, not that it runs. This
      # loads the built output from a subdirectory — the way Pages serves it —
      # and fails if the game does not actually start.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the built game
        run: npx tsx tools/smoke-build.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
